    Title: "Perpetual Grace Little Group"
    subtitle: "A small group ministry of Smyrna First Baptist Church"
    content: |
      Welcome to the Perpetual Grace Little Group!

      We’re so glad you’re here. This space is where we’ll share weekly discussion questions and important small group announcements. Our hope is that this group helps us stay encouraged, informed, and rooted in community throughout the week.

      We meet on Thursday nights at 6:30(ish) for a potluck and discussion. We would love for you to join us! If you’re interested, please reach out to Saindon or Natalie for more information. If this group isn’t the right fit for your schedule, we’d also be happy to connect you with one of our other small groups.

      Looking forward to gathering together soon!
